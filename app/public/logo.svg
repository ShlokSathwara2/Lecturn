<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#7c3aed;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1d4ed8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="grad3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  
  <!-- Left vertical bar -->
  <polygon points="60,180 60,60 90,45 90,180" fill="url(#grad1)" opacity="0.95"/>
  <polygon points="60,180 60,60 90,45 90,180" fill="url(#glass)"/>
  
  <!-- Right vertical bar -->
  <polygon points="140,180 140,60 110,45 110,180" fill="url(#grad2)" opacity="0.9"/>
  <polygon points="140,180 140,60 110,45 110,180" fill="url(#glass)"/>
  
  <!-- Top cap (graduation cap shape) -->
  <polygon points="40,55 100,25 160,55 100,75" fill="url(#grad1)" opacity="0.85"/>
  <polygon points="40,55 100,25 160,55 100,75" fill="url(#glass)"/>
  
  <!-- Top cap left wing -->
  <polygon points="40,55 100,25 80,20 30,48" fill="#1e3a5f" opacity="0.7"/>
  
  <!-- Top cap right wing -->
  <polygon points="160,55 100,25 120,20 170,48" fill="#06b6d4" opacity="0.6"/>
  
  <!-- Center connecting diamond -->
  <polygon points="100,65 120,90 100,115 80,90" fill="url(#grad3)" opacity="0.85"/>
  <polygon points="100,65 120,90 100,115 80,90" fill="url(#glass)"/>
  
  <!-- Glass reflection on left bar -->
  <polygon points="62,65 72,58 72,175 62,180" fill="white" opacity="0.12"/>
  
  <!-- Glass reflection on right bar -->
  <polygon points="138,65 128,58 128,175 138,180" fill="white" opacity="0.08"/>
  
  <!-- Top highlight -->
  <polygon points="45,52 100,28 155,52 100,70" fill="white" opacity="0.08"/>
  
  <!-- Bottom subtle glow -->
  <ellipse cx="100" cy="185" rx="50" ry="8" fill="#2563eb" opacity="0.15"/>
</svg>
